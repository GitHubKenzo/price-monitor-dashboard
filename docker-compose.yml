version: "3.9"

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-monitor-dashboard
    ports:
      - "8000:8000"
    environment:
      TZ: "Asia/Tokyo"
    volumes:
      - ../price-monitor/data/price.db:/data/price-monitor.sqlite
    restart: unless-stopped

  nginx:
    image: nginx:1.25
    container_name: dashboard-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - dashboard
    restart: unless-stopped

